name: Deploy Web and Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_web_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write build version file
        run: |
          mkdir -p public
          printf '{"versionCode": %s, "versionName": "1.0.0-%s", "builtAt": "%s", "apkUrl": "https://github.com/%s/releases/latest/download/app-debug.apk"}\n' "${{ github.run_number }}" "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.repository }}" > public/app-version.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Ensure Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Fixed Signing and Version Code
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          rm -f android/app/release.keystore
          rm -f android/app/shivam.keystore
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "GUARD FAILED: KEYSTORE_B64 / KEYSTORE_PASSWORD secrets missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/app/shivam.keystore
          ACTUAL_SHA=$(sha256sum android/app/shivam.keystore | cut -d' ' -f1)
          if [ "$ACTUAL_SHA" != "3d3bab09b547e422bd45cf01624d6ffa9e7dbb76b1e1089dbb51c2bd3987c515" ]; then
            echo "GUARD FAILED: decoded keystore sha256 mismatch: $ACTUAL_SHA"
            exit 1
          fi
          if ! keytool -list -keystore android/app/shivam.keystore -storepass "$KEYSTORE_PASSWORD" -alias shivamstaff >/dev/null 2>&1; then
            echo "GUARD FAILED: shivam.keystore unreadable (wrong bytes / password / alias)"
            exit 1
          fi
          EXPECTED_FP="67:EF:BB:3B:5D:A9:89:2C:EF:C6:73:2E:5E:12:D4:F2:BD:ED:34:FC:F2:14:86:88:6E:A4:DE:9D:6E:B3:69:83"
          ACTUAL_FP=$(keytool -list -v -keystore android/app/shivam.keystore -storepass "$KEYSTORE_PASSWORD" -alias shivamstaff 2>/dev/null | grep -m1 -i "SHA256:" | sed 's/.*SHA256:[[:space:]]*//' | tr -d ': ')
          if [ "$ACTUAL_FP" != "$(echo "$EXPECTED_FP" | tr -d ':')" ]; then
            echo "GUARD FAILED: keystore fingerprint mismatch"
            echo "GOT      : $ACTUAL_FP"
            echo "EXPECTED : $EXPECTED_FP"
            exit 1
          fi
          echo "Keystore fingerprint VERIFIED: $EXPECTED_FP"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          echo "=== SIGNING STATE (verification) ==="
          ls -la android/app/
          grep -n "signingConfig\|storeFile\|keyAlias\|versionCode\|versionName" android/app/build.gradle
          if [ -f android/app/release.keystore ]; then
            echo "GUARD FAILED: corrupt release.keystore is back"
            exit 1
          fi
          if grep -q "release.keystore" android/app/build.gradle; then
            echo "GUARD FAILED: build.gradle still references release.keystore"
            exit 1
          fi
          echo "ALL SIGNING GUARDS PASSED"

      - name: Build Signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Write in-app update pointer (version.json only - NO APK on Hosting)
        run: |
          mkdir -p dist/app
          printf '{"versionCode": %s, "url": "https://github.com/%s/releases/latest/download/app-debug.apk"}\n' "${{ github.run_number }}" "${{ github.repository }}" > dist/app/version.json
          echo "version.json written - APK is served by GitHub Releases (Spark plan forbids executables on Hosting)"
          cat dist/app/version.json
          ls -la dist/app/

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Shivam Staff App v1.0.0 (Build ${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Firestore Rules (repo source of truth — fixes task assign PERMISSION_DENIED)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npx --yes firebase-tools@latest deploy --only firestore:rules --project shivam-staff-ff7d5 --force
        continue-on-error: true

      - name: Deploy Web to Firebase Hosting (no APK in upload)
        uses: FirebaseExtended/action-hosting-deploy@v0
        continue-on-error: true
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: shivam-staff-ff7d5
          target: shivam-staff-app
