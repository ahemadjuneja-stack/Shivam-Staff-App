name: Deploy Web and Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_web_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write build version file
        run: |
          mkdir -p public
          printf '{"versionCode": %s, "versionName": "1.0.0-%s", "builtAt": "%s", "apkUrl": "https://github.com/%s/releases/latest/download/app-debug.apk"}\n' "${{ github.run_number }}" "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.repository }}" > public/app-version.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Ensure Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Fixed Signing and Version Code
        run: |
          rm -f android/app/release.keystore
          python3 scripts/fix_signing.py
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          echo "=== SIGNING STATE (verification) ==="
          ls -la android/app/
          grep -n "signingConfig\|storeFile\|keyAlias\|versionCode\|versionName" android/app/build.gradle
          if [ -f android/app/release.keystore ]; then
            echo "GUARD FAILED: corrupt release.keystore is back"
            exit 1
          fi
          if grep -q "release.keystore" android/app/build.gradle; then
            echo "GUARD FAILED: build.gradle still references release.keystore"
            exit 1
          fi
          if ! keytool -list -keystore android/app/shivam.keystore -storepass Shivam@2026 -alias shivamstaff >/dev/null 2>&1; then
            echo "GUARD FAILED: shivam.keystore unreadable (wrong bytes / password / alias)"
            exit 1
          fi
          echo "Keystore fingerprint (must match the EXPECTED line below):"
          keytool -list -keystore android/app/shivam.keystore -storepass Shivam@2026 -alias shivamstaff 2>/dev/null | grep -i "fingerprint"
          echo "EXPECTED  : 7D:87:27:EB:03:C2:D8:EB:32:9A:E4:B1:B7:4E:34:E8:99:64:E9:16:F4:EF:F9:EC:F4:1B:7E:F8:93:A2:11:92"
          echo "ALL SIGNING GUARDS PASSED"

      - name: Build Signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Write in-app update pointer (version.json only - NO APK on Hosting)
        run: |
          mkdir -p dist/app
          printf '{"versionCode": %s, "url": "https://github.com/%s/releases/latest/download/app-debug.apk"}\n' "${{ github.run_number }}" "${{ github.repository }}" > dist/app/version.json
          echo "version.json written - APK is served by GitHub Releases (Spark plan forbids executables on Hosting)"
          cat dist/app/version.json
          ls -la dist/app/

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Shivam Staff App v1.0.0 (Build ${{ github.run_number }})
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Web to Firebase Hosting (no APK in upload)
        uses: FirebaseExtended/action-hosting-deploy@v0
        continue-on-error: true
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: shivam-staff-ff7d5
          target: shivam-staff-app
